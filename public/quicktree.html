<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick tree — this trip, btw</title>
<meta name="description" content="Tap your way through a trip — every leg is a branch. A faster way to build, alongside the normal one.">
<link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.min.css?v=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23035A83'/%3E%3Cpath d='M0 68h100v16a16 16 0 0 1-16 16H16A16 16 0 0 1 0 84z' fill='%23F7B304'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/tokens.css?v=2">
<link rel="stylesheet" href="/fonts.css?v=1">
<link rel="stylesheet" href="/dark.css?v=2">
<style>
/* quicktree — the node builder (D-052).
   Nodes are stops, edges are legs; that is D-037's model made visible, not a new one.
   Three rules from Peter that shape everything here:
     · buttons, never <select> — a native dropdown on a phone is a full-screen modal for
       what should be one tap
     · the graph lives ON the map, so geography keeps meaning something
     · the user never arranges anything — the graph draws itself
   The draft it writes is the same v3 `ttb_scratch` /new writes, so a trip built here can be
   bought by exactly the same claim flow with no second import path to keep in step. */
:root{
  --disp:"Barlow Condensed",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --pine:var(--color-brand-teal,#035A83); --pine-deep:#024260;
  --accent:var(--color-brand-orange,#F7B304); --accent-deep:#C38D00;
  --ink:#141414; --soft:#5f6b70; --card:#fff; --line:#E4E1D8; --sheet:#FCFBF8;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#EAEBE7;--soft:#AAB0B7;--card:#1F252D;--line:#2C333C;--sheet:#171B21}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--body);color:var(--ink);background:var(--sheet)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#map{position:fixed;inset:0;z-index:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── chrome ─────────────────────────────────────────────────────────────────────────── */
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:10px;padding:12px 14px;pointer-events:none}
#top > *{pointer-events:auto}
.sign{min-height:44px;display:inline-flex;align-items:center;background:var(--pine);color:#fff;border:2px solid #ECECEC;outline:2px solid var(--pine-deep);
  border-radius:9px;padding:5px 11px;text-decoration:none;font-family:var(--disp);font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
#name{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:9px;
  padding:8px 11px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;
  text-transform:uppercase;outline:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#name:empty::before{content:"Name this trip";color:var(--soft)}
.iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:2px solid var(--ink);border-radius:50%;font-size:18px}

/* ── the microcard: one question at a time, above the map centre ─────────────────────── */
/* The menu, styled locally because this page does not load pages.css, and placed INSIDE the
   fixed bar rather than floating in the corner the bar already owns. */
#menu{position:fixed;top:56px;right:14px;z-index:60;background:var(--card);border:2px solid var(--ink);
  border-radius:12px;padding:6px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.2)}
#menu.show{display:block}
#menu a{display:block;min-height:44px;padding:11px 20px;font-family:var(--disp);font-weight:700;
  font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;
  border-radius:8px;white-space:nowrap}
#menu a:hover{background:var(--ground);color:var(--link)}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
  width:min(340px,calc(100vw - 28px));background:var(--card);border:2px solid var(--ink);
  border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:16px 16px 14px;display:none}
#card.show{display:block}
#card .crumb{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 3px;line-height:1.1}
#card .hint{color:var(--soft);font-size:13px;line-height:1.45;margin:0 0 12px}

/* Buttons, never a dropdown — Peter, and he is right: a native select on a phone is a
   full-screen modal for what should be one tap. */
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:9px 13px;
  background:var(--sheet);border:2px solid var(--line);border-radius:11px;
  font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.opt:hover{border-color:var(--pine);color:var(--pine)}
.opt.go{background:var(--accent);border-color:var(--accent);color:#141414;box-shadow:0 2px 0 var(--accent-deep)}
.opt.go:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent-deep)}
.opt svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.opt.skip{background:none;border-color:transparent;color:var(--soft);text-decoration:underline;
  letter-spacing:.02em;text-transform:none;font-family:var(--body);font-weight:600;padding:9px 4px}
.row{display:flex;gap:7px;margin-top:11px}
.tin{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:2px solid var(--line);
  border-radius:11px;background:var(--sheet);color:var(--ink);font-family:var(--body);font-size:16px}
.tin:focus{outline:0;border-color:var(--pine)}
#card .back{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;
  color:var(--soft);font-size:17px;line-height:1}

/* ── node markers ───────────────────────────────────────────────────────────────────── */
.qnode{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;background:var(--pine);color:#fff;border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.35);font-family:var(--disp);font-weight:700;font-size:14px}
.qnode.pend{background:var(--accent);color:#141414}

/* ── the bar ────────────────────────────────────────────────────────────────────────── */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);
  border-top:2px solid var(--ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px}
#tally{flex:1;min-width:0;font-size:13px;color:var(--soft);line-height:1.35}
#tally b{color:var(--ink)}
#keep{min-height:48px;padding:12px 18px;background:var(--accent);color:#141414;border-radius:11px;
  font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 2px 0 var(--accent-deep);white-space:nowrap}
#keep:disabled{opacity:.4;box-shadow:none;cursor:default}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:40;background:var(--ink);
  color:var(--sheet);padding:10px 15px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;
  pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* Leaflet's own zoom buttons ship at 30x30 — the most-tapped control on a map, and the
   smallest thing on the page. Measured, not assumed (device pass 2026-08-01). */
/* Leaflet ships `.leaflet-touch .leaflet-bar a` at 30x30 — two classes plus an element,
   so a one-class rule loses on specificity. Measured after deploying the naive version
   and finding it still 30px: match their selector or the override is decoration. */
.leaflet-touch .leaflet-bar a,
.leaflet-touch .leaflet-control-zoom a{width:44px;height:44px;line-height:44px;font-size:20px}
</style>

<div id="map"></div>

<div id="top">
  <a class="sign" href="/">this trip, btw</a>
  <div id="name" contenteditable="true" role="textbox" aria-label="Name this trip"></div>
  <button class="iconbtn" id="undo" title="Undo the last leg" aria-label="Undo the last leg">&#8630;</button>
  <button class="iconbtn" id="themeBtn" title="Night drive" aria-label="Theme. Tap to change.">☾</button>
  <button class="iconbtn" id="menuBtn" title="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">&#9776;</button>
</div>
<nav id="menu">
  <a href="/">Home</a><a href="/what-you-get">What's free</a><a href="/about">About</a><a href="/help">Help</a><a href="/faq">FAQ</a><a href="/for-agents">For AI</a><a href="/account">Account</a>
</nav>

<div id="card" role="dialog" aria-live="polite" aria-labelledby="qTitle">
  <button class="back" id="cardBack" aria-label="Back">&#10005;</button>
  <p class="crumb" id="qCrumb"></p>
  <h2 id="qTitle"></h2>
  <p class="hint" id="qHint"></p>
  <div class="opts" id="qOpts"></div>
  <div class="row" id="qRow" hidden></div>
</div>

<div id="bar">
  <p id="tally">Tap the map to drop your starting point.</p>
  <button id="keep" disabled>Keep it &middot; $5</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/leaflet-1.9.4/leaflet.min.js?v=1"></script>
<script src="/places.js?v=2"></script>
<script>
/* ── the tree ──────────────────────────────────────────────────────────────────────────
   Top-level modes are deliberately the five the whole pipeline already understands
   end-to-end — the draft format, the claim import, and the trip app. Peter's examples
   (car→uber, boat→ferry) are both SUBTYPES, which is where the expressiveness actually
   wanted to live anyway.

   Bike and Walk are here now (D-060), and they are the same self-powered case as the canoe:
   on their own leg the bike IS the vehicle, and on a leg where it rides on the car it is cargo.
   That is D-048 working for something other than a boat.

   `next` is what makes subtypes functional rather than decorative: the branch you take
   decides which question comes after it. */
const TREE = {
  drive: { label:"Drive", icon:'<path d="M3 16.5v-3l1.8-4.6A2 2 0 0 1 6.7 7.6h10.6a2 2 0 0 1 1.9 1.3L21 13.5v3z"/><circle cx="7.2" cy="16.6" r="1.5"/><circle cx="16.8" cy="16.6" r="1.5"/>',
    subs:[
      {id:"own",       label:"Our car",   keeps:true },
      {id:"rental",    label:"Rental",    keeps:true,  next:"pickup" },
      {id:"rideshare", label:"Uber / Lyft", keeps:false },
      {id:"taxi",      label:"Taxi",      keeps:false },
      {id:"bus",       label:"Bus",       keeps:false },
      {id:"rv",        label:"RV",        keeps:true  }
    ]},
  fly: { label:"Fly", icon:'<path d="M21 3 3 10.6l7.1 2.6 2.6 7.1z"/><path d="M21 3 10.6 13.4"/>',
    subs:[
      {id:"commercial", label:"Airline",   next:"flightno" },
      {id:"private",    label:"Private"    },
      {id:"heli",       label:"Helicopter" }
    ]},
  train: { label:"Rail", icon:'<rect x="6" y="4" width="12" height="12" rx="2"/><path d="M8 20l-2 2M16 20l2 2M6 16h12"/>',
    subs:[
      {id:"intercity", label:"Intercity", traced:true },
      {id:"commuter",  label:"Commuter",  traced:true },
      {id:"subway",    label:"Subway",    traced:true },
      {id:"tram",      label:"Tram",      traced:true }
    ]},
  ferry: { label:"Ferry", icon:'<path d="M4 17h16l-2 4H6z"/><path d="M6 17V9h12v8"/><path d="M12 5v4"/>',
    subs:[
      {id:"carferry",  label:"With the car", keeps:true },
      {id:"passenger", label:"On foot" }
    ]},
  bike: { label:"Bike", icon:'<circle cx="6" cy="17" r="3.3"/><circle cx="18" cy="17" r="3.3"/><path d="M6 17l4-8h5M9.5 9h4l3.5 8M14.5 6h2.5"/>',
    subs:[
      {id:"own",    label:"Our bikes", self:true, craft:"Bike", traced:true },
      {id:"rental", label:"Rented",    self:true, craft:"Bike", traced:true },
      {id:"ebike",  label:"E-bike",    self:true, craft:"E-bike", traced:true }
    ]},
  walk: { label:"Walk", icon:'<circle cx="13" cy="4.2" r="1.8"/><path d="M11 21l2-6-2.5-2.5.8-4.3 3.2 2 2.5 1M9 12.5L7.5 16M12.5 15l2.5 6"/>',
    subs:[
      {id:"walk", label:"On foot", self:true, traced:true },
      {id:"hike", label:"Hike",    self:true, traced:true },
      {id:"run",  label:"Run",     self:true, traced:true }
    ]},
  water: { label:"Boat", icon:'<path d="M3 18h18l-3 3H6z"/><path d="M12 4v11M6 15l6-11 6 11"/>',
    subs:[
      {id:"canoe",     label:"Canoe",     self:true, traced:true, craft:"Canoe" },
      {id:"kayak",     label:"Kayak",     self:true, traced:true, craft:"Kayak" },
      {id:"sail",      label:"Sailboat",  traced:true },
      {id:"motor",     label:"Motorboat", traced:true }
    ]}
};
const SVG = d => '<svg viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';

/* ── state ─────────────────────────────────────────────────────────────────────────────
   `origin` is node 0. Every leg is {to, mode, subtype, date, …} — a leg's mode lives on the
   ARRIVING stop, which is the shape the app and the claim import already expect (D-037). */
const SCRATCH_KEY = "ttb_scratch";
/* D-075: the parts of the draft this builder does not edit, carried across a load/save. Same
   loss `/quick` had — `people:[]` hardcoded and a single route written back — so a multi-track
   trip with a crew, opened here and touched once, came back as one track with nobody on it. */
let carried = { people: [], extraRoutes: [] };
let origin = null, legs = [], pending = null, step = null, draftLeg = null;
let nodeMarkers = [], edgeLines = [];

const map = L.map("map",{zoomControl:false,attributionControl:false}).setView([39.5,-98.35],4);
/* tiles are added by maptheme.js (D-087), which owns light and dark and must be the
   only thing adding a base layer — a second one here would sit under it forever. */
L.control.zoom({position:"bottomleft"}).addTo(map);

const $ = id => document.getElementById(id);
const esc = t => { const d=document.createElement("div"); d.textContent = t==null?"":t; return d.innerHTML; };
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2400); }

/* Name a tapped point through our own server (D-045) — Nominatim's cache sometimes drops the
   CORS header and the browser then shows raw coordinates instead of a place. */
async function placeName(lat,lng){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),4500);
  try{ const r=await fetch("/api/geocode?lat="+lat+"&lon="+lng,{signal:c.signal});
       const d=await r.json(); clearTimeout(t); return (d&&d.name)||null; }
  catch(e){ clearTimeout(t); return null; }
}
const coordName = (lat,lng) => "Dropped pin " + lat.toFixed(3) + ", " + lng.toFixed(3);

/* ── the map is the canvas: nodes sit where they really are, edges are the route ─────── */
function draw(){
  nodeMarkers.forEach(m=>map.removeLayer(m)); nodeMarkers=[];
  edgeLines.forEach(l=>map.removeLayer(l));   edgeLines=[];
  const pts = origin ? [origin, ...legs.map(l=>l.to)] : [];
  pts.forEach((p,i)=>{
    const m = L.marker([p.lat,p.lng], {icon: L.divIcon({className:"",
      html:'<div class="qnode">'+(i+1)+'</div>', iconSize:[30,30], iconAnchor:[15,15]})});
    // esc(): Leaflet assigns innerHTML when tooltip content is a string, and a place name is
    // third-party text from OpenStreetMap. Same rule as every other interpolation on this page.
    m.addTo(map).bindTooltip(esc(p.name||coordName(p.lat,p.lng)),{direction:"top",offset:[0,-16]});
    nodeMarkers.push(m);
  });
  // A pending destination shows as its own node so you can see what you tapped. No line is
  // drawn to it: touch has no cursor to trail, and a half-committed edge reads as a mistake.
  if(pending){
    const m = L.marker([pending.lat,pending.lng], {icon: L.divIcon({className:"",
      html:'<div class="qnode pend">?</div>', iconSize:[30,30], iconAnchor:[15,15]})});
    m.addTo(map); nodeMarkers.push(m);
  }
  for(let i=1;i<pts.length;i++){
    const leg = legs[i-1], flying = leg.mode==="fly";
    const l = L.polyline([[pts[i-1].lat,pts[i-1].lng],[pts[i].lat,pts[i].lng]],
      {color: flying ? "#3E7CB1" : "#F2A900", weight:4, opacity:.95,
       dashArray: flying ? "7 8" : null});
    l.addTo(map); edgeLines.push(l);
  }
  syncBar();
}
function syncBar(){
  const n=legs.length;
  $("keep").disabled = n===0;
  $("tally").innerHTML = n===0
    ? (origin ? "Now tap where you&rsquo;re going." : "Tap the map to drop your starting point.")
    : "<b>"+n+" leg"+(n>1?"s":"")+"</b> &middot; tap the map to add another";
}

/* ── the card: one question, buttons only ──────────────────────────────────────────── */
function ask(o){
  step = o;
  $("qCrumb").textContent = o.crumb || "";
  $("qTitle").textContent = o.title;
  $("qHint").innerHTML = o.hint || "";
  const opts = $("qOpts"); opts.innerHTML = "";
  (o.opts||[]).forEach(b=>{
    const el=document.createElement("button");
    el.type="button"; el.className="opt"+(b.cls?" "+b.cls:"");
    el.innerHTML=(b.icon?SVG(b.icon):"")+esc(b.label);
    el.onclick=()=>b.pick();
    opts.appendChild(el);
  });
  const row=$("qRow"); row.innerHTML=""; row.hidden=!o.row;
  if(o.row) o.row(row);
  $("cardBack").onclick = o.cancel || closeCard;
  $("card").classList.add("show");
}
function closeCard(){ $("card").classList.remove("show"); step=null; pending=null; draftLeg=null; draw(); }

/* ── tapping the map ────────────────────────────────────────────────────────────────── */
map.on("click", async e => {
  if(step && step.blocksMap) return;
  const p = {lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6), name:null};
  if(!origin){ askOrigin(p); return; }
  pending = p; draw();
  askMode(p);
  // Name it in the background; the tree never waits on the network.
  placeName(p.lat,p.lng).then(n=>{ if(n){ p.name=n; if(draftLeg) draftLeg.to.name=n; draw(); refreshCrumb(); } });
});

function refreshCrumb(){
  if(!step || !step.liveCrumb) return;
  $("qCrumb").textContent = step.liveCrumb();
}

function askOrigin(p){
  origin = p; draw();
  placeName(p.lat,p.lng).then(n=>{ if(n){ origin.name=n; draw(); refreshCrumb(); } });
  ask({
    crumb:"Node 1",
    liveCrumb:()=> "Node 1 · " + (origin.name || coordName(origin.lat,origin.lng)),
    title:"Starts here?",
    hint:"Or search for the place by name instead.",
    opts:[
      {label:"Yes, start here", cls:"go", pick:()=>{ closeCard(); toast("Now tap where you're going"); }},
      {label:"Move it",         pick:()=>{ origin=null; closeCard(); toast("Tap the new starting point"); }}
    ],
    row: r => {
      const i=document.createElement("input");
      i.className="tin"; i.type="text"; i.placeholder="Type a place…"; i.setAttribute("aria-label","Search a place");
      const b=document.createElement("button"); b.type="button"; b.className="opt"; b.textContent="Find";
      /* Suggestions as you type, ranked by what the map is looking at — otherwise "Reno"
         offers the German one first and the trip jumps to Europe. */
      setTimeout(()=>attachSuggest(i,{
        near: ()=>{ const c=map.getCenter(); return {lat:c.lat, lng:c.lng}; },
        onPick: p => { origin={lat:p.lat, lng:p.lng, name:p.name};
          map.setView([p.lat,p.lng],9); draw(); refreshCrumb();
          toast("Now tap where you're going"); closeCard(); }
      }), 0);
      const go=async()=>{
        const q=i.value.trim(); if(!q) return;
        b.textContent="…";
        try{
          const res=await fetch("/api/geocode?q="+encodeURIComponent(q));
          const j=(await res.json()).results||[];
          if(!j.length){ toast("No match — try a nearby town"); b.textContent="Find"; return; }
          // Nearest to what is on screen beats Nominatim's own ranking: for "Reno" the German
          // one outranks Nevada, which draws a leg to Europe and looks like a bug in us.
          const c=map.getCenter();
          let best=j[0], bd=Infinity;
          j.forEach(h=>{ const d=Math.hypot(h.lat-c.lat, h.lon-c.lng); if(d<bd){bd=d;best=h;} });
          origin={lat:best.lat, lng:best.lon, name:best.name};
          map.setView([best.lat,best.lon], 9); draw(); refreshCrumb();
          b.textContent="Find"; toast("Now tap where you're going"); closeCard();
        }catch(e){ b.textContent="Find"; toast("Search didn't answer — tap the map instead"); }
      };
      b.onclick=go; i.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();go();} });
      r.appendChild(i); r.appendChild(b);
    },
    cancel:()=>{ origin=null; closeCard(); }
  });
}

/* Step 1 of a leg: how. */
function askMode(to){
  draftLeg = {to, mode:null, subtype:null, date:"", who:[], path:null, stay:null, note:""};
  const from = legs.length ? legs[legs.length-1].to : origin;
  ask({
    crumb:"Leg " + (legs.length+1),
    liveCrumb:()=> "Leg " + (legs.length+1) + " · to " + (to.name || coordName(to.lat,to.lng)),
    title:"How do you get there?",
    hint:"From <b>"+esc(from.name || coordName(from.lat,from.lng))+"</b>",
    opts: Object.keys(TREE).map(k=>({
      label:TREE[k].label, icon:TREE[k].icon,
      pick:()=>{ draftLeg.mode=k; askSub(k); }
    })),
    cancel:()=>{ closeCard(); }
  });
}

/* Step 2: which kind. This is the branch that decides what gets asked next. */
function askSub(mode){
  const m = TREE[mode];
  ask({
    crumb:"Leg " + (legs.length+1) + " · " + m.label,
    title:"What kind?",
    hint:"This changes what we ask next.",
    opts: m.subs.map(s=>({
      label:s.label,
      pick:()=>{
        draftLeg.subtype = s.id;
        if(s.next === "flightno") return askFlight(s);
        if(s.next === "pickup")   return askPickup(s);
        askDate(s);
      }
    })),
    cancel:()=>askMode(draftLeg.to)
  });
}

/* fly → airline: a flight number is what makes a real lookup possible later, so it is worth
   one field. It stays optional — the leg is fine without it and we never invent a time. */
function askFlight(s){
  ask({
    crumb:"Leg " + (legs.length+1) + " · Airline",
    title:"Flight number?",
    hint:"Optional. With it, Ask can fill in the real times once the trip is yours.",
    opts:[{label:"Skip", cls:"skip", pick:()=>askDate(s)}],
    row: r => {
      const i=document.createElement("input");
      i.className="tin"; i.type="text"; i.placeholder="e.g. AA1902";
      i.autocapitalize="characters"; i.setAttribute("aria-label","Flight number");
      const b=document.createElement("button"); b.type="button"; b.className="opt go"; b.textContent="Next";
      const go=()=>{ const v=i.value.trim().toUpperCase(); if(v) draftLeg.flight=v; askDate(s); };
      b.onclick=go; i.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();go();} });
      r.appendChild(i); r.appendChild(b);
    },
    cancel:()=>askSub(draftLeg.mode)
  });
}

/* drive → rental: where you picked it up genuinely changes the trip, because the car has to
   go back. We only note it for now; the return leg is a later conversation. */
function askPickup(s){
  ask({
    crumb:"Leg " + (legs.length+1) + " · Rental",
    title:"Picked up here?",
    hint:"A rental has to go back somewhere — worth writing down now.",
    opts:[
      {label:"Yes, here",    pick:()=>{ draftLeg.note="Rental picked up here"; askDate(s); }},
      {label:"Somewhere else", pick:()=>{ draftLeg.note="Rental picked up elsewhere"; askDate(s); }},
      {label:"Not sure yet", cls:"skip", pick:()=>askDate(s)}
    ],
    cancel:()=>askSub(draftLeg.mode)
  });
}

/* Step 3: when. Optional by design — D-044 exists because most real trips never get dates. */
function askDate(s){
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const today = new Date(), tom = new Date(Date.now()+86400000);
  ask({
    crumb:"Leg " + (legs.length+1) + " · " + TREE[draftLeg.mode].label + " · " + s.label,
    title:"When?",
    hint:"Skip it if you don&rsquo;t know yet — an undated leg still holds its place in the order.",
    opts:[
      {label:"Today",     pick:()=>commit(s, iso(today))},
      {label:"Tomorrow",  pick:()=>commit(s, iso(tom))},
      {label:"Skip",  cls:"skip", pick:()=>commit(s, "")}
    ],
    row: r => {
      const i=document.createElement("input");
      i.className="tin"; i.type="date"; i.setAttribute("aria-label","Pick a date");
      const b=document.createElement("button"); b.type="button"; b.className="opt go"; b.textContent="Add leg";
      b.onclick=()=>commit(s, i.value||"");
      r.appendChild(i); r.appendChild(b);
    },
    cancel:()=>askSub(draftLeg.mode)
  });
}

function commit(s, date){
  draftLeg.date = date;
  // A self-powered subtype names the craft, which is what makes it its own vehicle on this
  // leg and a child of whatever carries it on the others (D-048).
  if(s.craft) draftLeg.craft = s.craft;
  if(!draftLeg.to.name) draftLeg.to.name = coordName(draftLeg.to.lat, draftLeg.to.lng);
  legs.push(draftLeg);
  const traced = s.traced, self = s.self;
  draftLeg = null; pending = null;
  closeCard(); save(); draw();
  // Say what the branch implies rather than leaving it to be discovered later.
  if(self)        toast("Added — a paddle gets its own vehicle once you open the trip");
  else if(traced) toast("Added — you'll trace this route in the trip itself");
  else            toast("Leg added — tap the map for the next one");
}

/* ── the draft: the shared v3 `ttb_scratch` shape (D-075) ─────────────────────────────────
   Not "byte-identical to what /new writes" — that claim was false and is why nobody checked
   (DEEP_AUDIT D3). Each builder preserves what it does not edit; that is the actual contract. */
function save(){
  const d = {v:3, created:Date.now(), name:$("name").textContent.trim(),
    people:carried.people,
    routes:[{origin, legs:legs.map(l=>({...l, to:l.to, mode:l.mode, subtype:l.subtype||null,
      craft:l.craft||null, flight:l.flight||null, date:l.date, who:l.who, path:l.path,
      stay:l.stay, note:l.note}))}, ...carried.extraRoutes]};
  try{ localStorage.setItem(SCRATCH_KEY, JSON.stringify(d)); }catch(e){}
  syncBar();
}
function restore(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(SCRATCH_KEY)||"null"); }catch(e){}
  if(!d || d.v!==3 || !Array.isArray(d.routes) || !d.routes.length) return;
  const r=d.routes[0]; if(!r || !r.origin) return;
  carried = { people: Array.isArray(d.people)?d.people:[], extraRoutes: d.routes.slice(1) };
  origin=r.origin; legs=(r.legs||[]).map(l=>({...l, who:l.who||[]}));
  if(d.name) $("name").textContent=d.name;
  draw();
  if(legs.length){
    const pts=[origin,...legs.map(l=>l.to)].map(p=>[p.lat,p.lng]);
    try{ map.fitBounds(pts,{padding:[60,60],paddingBottomRight:[60,140],maxZoom:11}); }catch(e){}
    toast("Picked up where you left off");
  }
}

$("undo").onclick = () => {
  if(step){ closeCard(); return; }
  if(legs.length){ legs.pop(); save(); draw(); toast("Last leg removed"); return; }
  if(origin){ origin=null; save(); draw(); toast("Starting point cleared"); return; }
  toast("Nothing to undo yet");
};
$("name").addEventListener("input", save);
$("name").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } });

/* Same handoff as /new, including the warning: the draft rides to checkout in THIS browser,
   and paying somewhere else buys an empty trip. */
/* ── which door they came in by (D-055) ─────────────────────────────────────────────────
   The one measurement compatible with promising no analytics. `?via=agents` is remembered
   for this draft and handed to Stripe as `client_reference_id` on the checkout link, so the
   Stripe dashboard can say "this purchase came from the agents page" and nothing else can.

   What it is not: not a cookie, not an identifier, not persistent, not cross-site, and not
   attached to a person. It is a word on a payment Stripe already has in full. Without it the
   choice is between guessing whether a channel works and building a tracker, and neither is
   acceptable. Allowlisted so a stranger cannot stuff arbitrary text into our payment records
   by handing someone a crafted link.
   Attribution is first-touch for the tab: sessionStorage keeps the first door you came in
   by until the tab closes, so wandering off to /about and back does not relabel the visit.
   A rejected token stores nothing rather than truncating to something plausible. */
const VIA_KEY = "ttb_via";
(function(){
  const m = (location.search.match(/[?&]via=([a-z0-9-]{1,16})\b/) || [])[1];
  if (m) { try { sessionStorage.setItem(VIA_KEY, m); } catch(e){} }
})();
function viaParam(){
  let v = ""; try { v = sessionStorage.getItem(VIA_KEY) || ""; } catch(e){}
  return /^[a-z0-9-]{1,16}$/.test(v) ? "?client_reference_id=via_" + v : "";
}

$("keep").onclick = () => {
  if(!legs.length){ toast("Add a leg first"); return; }
  save();
  const go = () => { location.href = "https://buy.stripe.com/eVqbJ1gYm4M726gcMXaIM00" + viaParam(); };
  if(sessionStorage.getItem("ttb_handoff_ack")) return go();
  const ok = confirm(
    "Finish checkout in this browser.\n\n" +
    "Your " + legs.length + "-leg trip is saved on this device and comes with you when you get " +
    "back. Paying on a different phone or browser would give you an empty trip instead.\n\n" +
    "OK to continue.");
  if(!ok) return;
  sessionStorage.setItem("ttb_handoff_ack","1");
  go();
};

restore(); syncBar();
</script>
