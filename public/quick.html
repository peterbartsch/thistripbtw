<style>
/* /quick — the ring builder, and the promoted way to START a trip (D-063).
 *
 * Tap where you are, tap where you're going, and a ring opens at the point with the choices
 * that actually apply. Three steps and the leg commits: mode → kind → when. The ring only
 * opens when there IS a choice, it anchors at the tapped point rather than centre-screen, and
 * typing gets a card instead of a ring, because a text field in a radial menu is neither.
 *
 * This builds the SHAPE of a trip. It does not try to be the editor: dates, stays, notes and
 * who-was-on-which-leg are all easier in a list than in a ring, so "cards" hands off to /new,
 * which is the leg-card editor and holds the chat and the road routing. The toggle goes both
 * ways — /new links back here.
 *
 * Writes the shared v3 `ttb_scratch` draft, so a trip started here is claimable by the one
 * shared claim path. **Not "byte for byte" — that claim was here, it was false, and it is why
 * nobody checked** (DEEP_AUDIT D3): this builder edits one route and no crew, /new edits every
 * route and the crew but had no UI for subtype/craft/flight, and each silently rewrote the whole
 * draft from its own view. D-075's contract is narrower and true: **a builder preserves what it
 * does not edit.** Anything changing the draft shape has to change index.html's pinFor/MODE_MAP
 * too; that pair has silently dropped fields twice.
 */
:root{
  --disp:"Barlow Condensed",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --pine:var(--color-brand-teal,#035A83); --pine-deep:#024260;
  --accent:var(--color-brand-orange,#F7B304); --accent-deep:#C38D00;
  --ink:#141414; --soft:#5f6b70; --card:#fff; --line:#E4E1D8; --sheet:#FCFBF8;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#EAEBE7;--soft:#AAB0B7;--card:#1F252D;--line:#2C333C;--sheet:#171B21}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--body);color:var(--ink);background:var(--sheet)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#map{position:fixed;inset:0;z-index:0}

#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:9px;
  padding:12px 14px;pointer-events:none}
#top>*{pointer-events:auto}
/* The menu, styled locally because this page does not load pages.css. It sits INSIDE the
   fixed bar rather than floating at top:14px/right:14px like the content pages: that corner
   already belongs to the bar here, and a floating button would land on top of it. */
#menu{position:fixed;top:56px;right:14px;z-index:60;background:var(--card);border:2px solid var(--ink);
  border-radius:12px;padding:6px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.2);pointer-events:auto}
#menu.show{display:block}
#menu a{display:block;min-height:44px;padding:11px 20px;font-family:var(--disp);font-weight:700;
  font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;
  border-radius:8px;white-space:nowrap}
#menu a:hover{background:var(--ground);color:var(--link)}
#menu a[aria-current="page"]{background:var(--ground)}
.sign{min-height:44px;display:inline-flex;align-items:center;background:var(--pine);color:#fff;border:2px solid #ECECEC;outline:2px solid var(--pine-deep);
  border-radius:9px;padding:5px 10px;text-decoration:none;font-family:var(--disp);font-weight:700;
  font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
#name{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:9px;
  padding:8px 11px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;
  text-transform:uppercase;outline:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#name:empty::before{content:"Name this trip";color:var(--soft)}
/* 44, not 42: measured at 375x812 and every bar control came back 42 (review Q2). The
   .sm modifier was already 44, so the class named 'small' was the bigger one. */
.ico{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:2px solid var(--ink);border-radius:50%;font-size:17px}

/* ── the ring ─────────────────────────────────────────────────────────────────────────── */
#veil{position:fixed;inset:0;z-index:30;display:none}
#veil.on{display:block}
#ring{position:fixed;z-index:40;opacity:0;pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;transform:scale(.88)}
#ring.show{opacity:1;transform:scale(1);pointer-events:auto}
@media (prefers-reduced-motion:reduce){ #ring{transition:none} }
#ring svg{display:block;overflow:visible;filter:drop-shadow(0 10px 26px rgba(0,0,0,.3))}
body.ringing .leaflet-marker-icon.is-here{opacity:0}

.seg{cursor:pointer}
.seg .wedge{fill:var(--card);stroke:var(--ink);stroke-width:2;transition:fill .1s}
.seg:hover .wedge,.seg:focus-visible .wedge{fill:var(--accent)}
.seg:focus-visible{outline:none}
.seg:focus-visible .wedge{stroke-width:3.5}
.seg .lbl{font-family:var(--disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.seg .gly{fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none}
.hub{fill:var(--pine);stroke:#fff;stroke-width:3}
.hub-t{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;fill:rgba(255,255,255,.66);text-anchor:middle}
.hub-p{font-family:var(--disp);font-weight:700;fill:#fff;text-anchor:middle}
.hub-back{cursor:pointer}
.hub-back:hover .hub{fill:var(--pine-deep)}

/* Typing gets a card. A ring cannot hold a keyboard. */
#ask{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;
  width:min(320px,calc(100vw - 28px));background:var(--card);border:2px solid var(--ink);
  border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:16px;display:none}
#ask.on{display:block}
#ask h2{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 3px}
#ask p{margin:0 0 11px;font-size:13px;color:var(--soft);line-height:1.45}
#ask input{width:100%;min-height:46px;padding:11px 13px;border:2px solid var(--line);
  border-radius:11px;background:var(--sheet);color:var(--ink);font-size:16px;font-family:var(--body)}
#ask input:focus{outline:0;border-color:var(--pine)}
#ask .row{display:flex;gap:8px;margin-top:11px}
#ask button{flex:1;min-height:46px;border-radius:11px;font-family:var(--disp);font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--line)}
#ask button.go{background:var(--accent);border-color:var(--accent);color:#141414}

/* ── nodes + bar ──────────────────────────────────────────────────────────────────────── */
.node{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  background:var(--pine);color:#fff;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);
  font-family:var(--disp);font-weight:700;font-size:13px}
.node.sel{outline:3px solid var(--accent);outline-offset:2px}
/* F13: insert-before / insert-after, flanking each stop. The circle reads 20px so it does not
   compete with the numbered node, but the button is 34x44 — DESIGN.md's minimum is 44 and a
   map is the worst place to miss. */
.nodewrap{display:flex;align-items:center;justify-content:center;gap:2px;background:none;border:0}
.ins{width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent}
/* W10: "a + in a circle" (Peter). The circle is the visual; the 44px button is the target. */
.ins b{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card,#fff);border:2px solid var(--pine);color:var(--pine);
  font:700 17px/1 var(--disp);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ins:hover b,.ins:focus-visible b{background:var(--pine);color:#fff;transform:scale(1.1)}
.node.armed{outline:3px solid var(--pine);outline-offset:2px}
.node.pend{background:var(--accent);color:#141414}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);
  border-top:2px solid var(--ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px}
#tally{flex:1;min-width:0;font-size:13px;color:var(--soft);line-height:1.35}
/* Offered only once geolocation has actually answered — never a button that might not work. */
#hereBtn{flex:none;background:var(--pine);color:#fff;border:2px solid var(--pine-deep);border-radius:9px;
  padding:7px 11px;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.05em;
  text-transform:uppercase;white-space:nowrap;cursor:pointer;min-height:38px}
#hereBtn[hidden]{display:none}
#tally b{color:var(--ink)}
#keep{min-height:46px;padding:12px 17px;background:var(--accent);color:#141414;border-radius:11px;
  font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 2px 0 var(--accent-deep);white-space:nowrap}
#keep:disabled{opacity:.4;box-shadow:none;cursor:default}
.ico.sm{width:44px;height:44px;font-size:19px;border-width:2px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:50;background:var(--ink);
  color:var(--sheet);padding:10px 15px;border-radius:10px;font-size:14px;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* Leaflet's own zoom buttons ship at 30x30 — the most-tapped control on a map, and the
   smallest thing on the page. Measured, not assumed (device pass 2026-08-01). */
/* Leaflet ships `.leaflet-touch .leaflet-bar a` at 30x30 — two classes plus an element,
   so a one-class rule loses on specificity. Measured after deploying the naive version
   and finding it still 30px: match their selector or the override is decoration. */
.leaflet-touch .leaflet-bar a,
.leaflet-touch .leaflet-control-zoom a{width:44px;height:44px;line-height:44px;font-size:20px}
</style>

<div id="map"></div>
<div id="top">
  <a class="sign" href="/new" id="toCards">cards &rarr;</a>
  <div id="name" contenteditable="true" role="textbox" aria-label="Name this trip"></div>
  <button class="ico" id="undo" title="Undo" aria-label="Undo the last thing">&#8630;</button>
  <button class="ico" id="themeBtn" title="Night drive" aria-label="Theme. Tap to change.">☾</button>
  <button class="ico" id="menuBtn" title="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">&#9776;</button>
</div>

</nav>

<div id="veil"></div>
<div id="ring" role="menu" aria-label="Choose"></div>

<div id="ask" role="dialog" aria-modal="true" aria-labelledby="askT">
  <h2 id="askT"></h2><p id="askP"></p>
  <input id="askI"><div class="row">
    <button id="askSkip">Skip</button><button class="go" id="askGo">Next</button></div>
</div>

<div id="bar">
  <p id="tally">Tap the map where the trip starts.</p>
  <button id="hereBtn" hidden>Start here</button>
  <button class="ico sm" id="findBtn" title="Type a place" aria-label="Type a place instead of tapping">&#9906;</button>
  <button id="keep" disabled>Keep it &middot; $5</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/leaflet-1.9.4/leaflet.min.js?v=1"></script>
<script src="/places.js?v=2"></script>
<script>
/* Same tree as /quicktree so the comparison is about the control, not the content.
   `next` is what makes a subtype functional rather than decorative: the branch decides what
   is asked after it. */
const TREE = {
  drive:{ label:"Drive", gly:'<path d="M3 16.5v-3l1.8-4.6A2 2 0 0 1 6.7 7.6h10.6a2 2 0 0 1 1.9 1.3L21 13.5v3z"/><circle cx="7.2" cy="16.6" r="1.5"/><circle cx="16.8" cy="16.6" r="1.5"/>',
    subs:[{id:"own",label:"Our car"},{id:"rental",label:"Rental",next:"pickup"},
          {id:"rideshare",label:"Uber"},{id:"taxi",label:"Taxi"},{id:"bus",label:"Bus"},{id:"rv",label:"RV"}] },
  fly:{ label:"Fly", gly:'<path d="M21 3 3 10.6l7.1 2.6 2.6 7.1z"/><path d="M21 3 10.6 13.4"/>',
    subs:[{id:"commercial",label:"Airline",next:"flight"},{id:"private",label:"Private"},{id:"heli",label:"Heli"}] },
  train:{ label:"Rail", gly:'<rect x="6" y="4" width="12" height="12" rx="2"/><path d="M8 20l-2 2M16 20l2 2M6 16h12"/>',
    subs:[{id:"intercity",label:"Intercity"},{id:"commuter",label:"Commuter"},{id:"subway",label:"Subway"},{id:"tram",label:"Tram"}] },
  ferry:{ label:"Ferry", gly:'<path d="M4 17h16l-2 4H6z"/><path d="M6 17V9h12v8"/><path d="M12 5v4"/>',
    subs:[{id:"carferry",label:"With car"},{id:"passenger",label:"On foot"}] },
  water:{ label:"Boat", gly:'<path d="M12 4v11M6 15l6-11 6 11"/><path d="M3 18h18l-3 3H6z"/>',
    subs:[{id:"canoe",label:"Canoe",craft:"Canoe"},{id:"kayak",label:"Kayak",craft:"Kayak"},
          {id:"sail",label:"Sail"},{id:"motor",label:"Motor"}] },
  bike:{ label:"Bike", gly:'<circle cx="6" cy="17" r="3.3"/><circle cx="18" cy="17" r="3.3"/><path d="M6 17l4-8h5M9.5 9h4l3.5 8M14.5 6h2.5"/>',
    subs:[{id:"own",label:"Ours",craft:"Bike"},{id:"rental",label:"Rented",craft:"Bike"},{id:"ebike",label:"E-bike",craft:"E-bike"}] },
  walk:{ label:"Walk", gly:'<circle cx="13" cy="4.2" r="1.8"/><path d="M11 21l2-6-2.5-2.5.8-4.3 3.2 2 2.5 1M9 12.5L7.5 16M12.5 15l2.5 6"/>',
    subs:[{id:"walk",label:"On foot"},{id:"hike",label:"Hike"},{id:"run",label:"Run"}] },
};
const SCRATCH_KEY = "ttb_scratch";
/* D-075: the parts of the draft this builder does not edit, carried across a load/save so it
   stops destroying them. `/quick` edits exactly one route and no crew, and it used to rewrite the
   whole draft from that — `people:[]` hardcoded and `routes:[{…}]` a single entry — so a
   multi-track trip with a named crew, built in `/new` and touched once here, came back as one
   track with nobody on it. No warning, no undo. Declared beside the key it belongs to and before
   anything reads it: a `let` used above its definition throws and kills the entire inline script,
   which is a documented sharp edge in this repo. */
let carried = { people: [], extraRoutes: [] };
/* W4 (cold walk 2026-07-29): what the bar says while a ring step is open. It used to keep
   the previous instruction, so it read "now tap where you're going" while the ring was
   already asking how you travel. */
const RING_ASKS = { mode:"How are you getting there?", kind:"What kind?", when:"When?" };
/* D-065: the ring stops being append-only. `editing` is the index in `legs` that the ring is
   currently operating on, or null when it is building a new one. Everything downstream — the
   three steps, commit, cancel — is the same code either way; only the destination differs. */
let editing = null;
/* D-065 / audit F13: where the NEXT tapped point should land in the chain. null means the
   end, which is what tapping the map has always meant. A number is a slot chosen with one of
   the + buttons flanking a marker. Marker i arrives on legs[i-1], so marker i's "before" is
   slot i-1 and its "after" is slot i — every slot from 0 to n is reachable, exactly once.
   The origin carries no buttons because its "after" is marker 1's "before". */
let insertAt = null;
/* W11/W12 (second cold walk): the + buttons used to exist on every marker permanently, which
   put a 116px-wide invisible wrapper over the line either side of every stop — a tap meant to
   EDIT a leg silently started an INSERT instead. Now a marker must be ARMED first: one tap
   shows its two +, a second tap opens the editor, a map tap disarms without placing a point.
   Only one marker's buttons exist at a time, so nothing covers a line you didn't just touch,
   and the duplicate interior slots (marker i's "after" = marker i+1's "before") can never be
   on screen together. */
let armed = null;

const map = L.map("map",{zoomControl:false,attributionControl:false}).setView([39.5,-98.35],4);
/* tiles are added by maptheme.js (D-087), which owns light and dark and must be the
   only thing adding a base layer — a second one here would sit under it forever. */
L.control.zoom({position:"bottomleft"}).addTo(map);

const $ = id => document.getElementById(id);
const esc = t => { const d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; };
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2300); }

let origin=null, legs=[], pending=null, draft=null, layers=[], step=null;

/* ── geometry ─────────────────────────────────────────────────────────────────────────── */
const polar = (cx,cy,r,a) => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
function wedgePath(cx,cy,r0,r1,a0,a1){
  const [x0,y0]=polar(cx,cy,r1,a0), [x1,y1]=polar(cx,cy,r1,a1);
  const [x2,y2]=polar(cx,cy,r0,a1), [x3,y3]=polar(cx,cy,r0,a0);
  const big=(a1-a0)>Math.PI?1:0;
  return `M${x0} ${y0}A${r1} ${r1} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${big} 0 ${x3} ${y3}Z`;
}
/* Sized from the viewport. A fixed ring covers the map on a small phone and looks lost on a
   desktop, and this control is meant to sit ON the thing it is about. */
function dims(n){
  const v = Math.min(innerWidth, innerHeight);
  const r1 = Math.max(96, Math.min(150, v*0.29));
  const r0 = Math.max(54, r1*(n > 5 ? 0.50 : 0.54));
  return {r0, r1, pad:22, fs: v < 380 ? 11 : 12.5};
}

/* ── the ring ─────────────────────────────────────────────────────────────────────────── */
function openRing(at, title, sub, items, onPick, onBack){
/* W5: "Tomorrow" overran its wedge. `fs` comes from dims(n) — the NUMBER of wedges — and never
   from the length of the word in one, so a long label simply spilled past the segment.

   The wedge gives a real bound: at radius rm the chord across an angle of stepA is
   2·rm·sin(stepA/2). Estimate the label at ~0.52em per glyph for the condensed display face,
   and when it does not fit, hand SVG the width and let it compress the glyphs. Only shrinks the
   labels that need it, so nothing else on the ring changes. */
function fit(label, fs, rm, stepA){
  const avail = 2 * rm * Math.sin(stepA / 2) * 0.86;      // 0.86 leaves the wedge edges alone
  const est   = String(label).length * fs * 0.63;   // uppercase WITH .05em tracking — 0.52 (mixed case, no tracking) under-read by a fifth
  return est <= avail ? "" : ` textLength="${avail.toFixed(1)}" lengthAdjust="spacingAndGlyphs"`;
}

  const n=items.length, {r0,r1,pad,fs}=dims(n), c=r1+pad, size=c*2;
  const stepA=(Math.PI*2)/n, start=-Math.PI/2-stepA/2;
  let svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  items.forEach((it,i)=>{
    const a0=start+i*stepA, a1=a0+stepA*0.96, mid=(a0+a1)/2, rm=(r0+r1)/2;
    const [lx,ly]=polar(c,c,rm,mid);
    svg+=`<g class="seg" role="menuitem" tabindex="0" data-i="${i}" aria-label="${esc(it.label)}">
      <path class="wedge" d="${wedgePath(c,c,r0,r1,a0,a1)}"/>
      ${it.gly?`<g class="gly" transform="translate(${lx-11} ${ly-23}) scale(.9)">${it.gly}</g>`:""}
      <text class="lbl" style="font-size:${fs}px"${fit(it.label,fs,rm,stepA)} x="${lx}" y="${it.gly?ly+13:ly}">${esc(it.label)}</text></g>`;
  });
  svg+=`<g class="hub-back" role="menuitem" tabindex="0" aria-label="${onBack?"Back":"Cancel"}">
    <circle class="hub" cx="${c}" cy="${c}" r="${r0-7}"/>
    <text class="hub-t" x="${c}" y="${c-11}">${esc(title)}</text>
    <text class="hub-p" style="font-size:${fs+3}px" x="${c}" y="${c+9}">${esc(sub)}</text></g></svg>`;

  const ring=$("ring");
  ring.innerHTML=svg;
  place(ring, at, size);
  ring.classList.add("show"); $("veil").classList.add("on");
  document.body.classList.add("ringing");
  ring.querySelectorAll(".seg").forEach(g=>{
    const i=+g.dataset.i, go=e=>{ e.preventDefault(); e.stopPropagation(); onPick(items[i],i); };
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") go(e); });
  });
  const hub=ring.querySelector(".hub-back");
  const back=e=>{ e.preventDefault(); e.stopPropagation(); onBack?onBack():cancel(); };
  hub.addEventListener("click",back);
  hub.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") back(e); });
  requestAnimationFrame(()=>{ const f=ring.querySelector(".seg"); if(f) f.focus(); });
}

/* Anchor the ring ON the point. Pan only if it would fall off an edge, and only by as much as
   it takes — panning every time is what made the first pass feel like the map was fighting you. */
function place(ring, latlng, size){
  const p = map.latLngToContainerPoint(latlng);
  const half = size/2, m = 8, barH = 74, topH = 62;
  let dx=0, dy=0;
  if(p.x-half < m)                 dx = (p.x-half) - m;
  else if(p.x+half > innerWidth-m) dx = (p.x+half) - (innerWidth-m);
  if(p.y-half < topH)              dy = (p.y-half) - topH;
  else if(p.y+half > innerHeight-barH) dy = (p.y+half) - (innerHeight-barH);
  if(dx || dy) map.panBy([dx,dy],{animate:true,duration:.25});
  const q = {x:p.x-dx, y:p.y-dy};
  ring.style.left = (q.x-half)+"px";
  ring.style.top  = (q.y-half)+"px";
}
function closeRing(){
  $("ring").classList.remove("show"); $("ring").innerHTML="";
  $("veil").classList.remove("on"); document.body.classList.remove("ringing");
}
function cancel(){ closeRing(); pending=null; draft=null; step=null; editing=null; insertAt=null; armed=null; render(); }
$("veil").addEventListener("click", cancel);

/* ── the card, for the two places a keyboard is genuinely needed ──────────────────────── */
function openAsk(title, hint, placeholder, onDone){
  $("askT").textContent=title; $("askP").textContent=hint;
  $("askI").value=""; $("askI").placeholder=placeholder;
  $("ask").classList.add("on"); closeRing();
  requestAnimationFrame(()=>$("askI").focus());
  const done=v=>{ $("ask").classList.remove("on"); onDone(v); };
  $("askGo").onclick=()=>done($("askI").value.trim());
  $("askSkip").onclick=()=>done("");
  $("askI").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); done($("askI").value.trim()); } };
}

/* Typing a place takes the SAME path as tapping one — it calls the map's own click handler —
   so leg chaining, naming and saving can only behave one way. The radial could only be tapped
   until now, which is fine for a place you can find by sight and useless for a town you know
   by name. */
let suggest = null;
function openSearch(){
  if(step) cancel();
  $("askT").textContent = origin ? "Where next?" : "Where does it start?";
  $("askP").textContent = "Pick one and it drops on the map, exactly as a tap would.";
  $("askI").value=""; $("askI").placeholder="Type a place…";
  $("askSkip").textContent = "Cancel";
  $("ask").classList.add("on");
  requestAnimationFrame(()=>$("askI").focus());
  if(!suggest && typeof attachSuggest === "function"){
    suggest = attachSuggest($("askI"), {
      near: ()=>{ try{ const c=map.getCenter(); return {lat:c.lat, lng:c.lng}; }catch(e){ return null; } },
      onPick: p => {
        $("ask").classList.remove("on");
        map.setView([p.lat,p.lng], 9);
        // Fire the map's own handler so there is exactly one way a point joins the trip.
        map.fire("click", {latlng: L.latLng(p.lat, p.lng)});
        // The click handler geocodes; we already know the name, so keep the better one.
        const t = pending || origin;
        if(t){ t.name = p.name; render(); if(step) reopen(); }
      }
    });
  }
  const close = ()=>{ $("ask").classList.remove("on"); $("askSkip").textContent="Skip"; };
  $("askSkip").onclick = close;
  $("askGo").onclick = close;      // Enter picks a suggestion; the button is just a way out
}
$("findBtn").onclick = openSearch;

/* ── drawing ──────────────────────────────────────────────────────────────────────────── */
function render(){
  // one place to keep the chip honest: any origin at all, from any path, retires it
  { const b=document.getElementById("hereBtn"); if(b && origin) b.hidden=true; }
  layers.forEach(l=>map.removeLayer(l)); layers=[];
  const pts = origin ? [origin, ...legs.map(l=>l.to)] : [];
  pts.forEach((p,i)=>{
    const sel = editing !== null && i === editing + 1;
    const isArmed = armed === i;
    const plus = w => `<button class="ins" data-slot="${w}" type="button"
        aria-label="Add a stop ${w === i-1 ? "before" : "after"} this one"><b>+</b></button>`;
    // W10: the + sits in a circle (the <b>), so it reads as a control, not cartography.
    // Armed marker i>0 offers before (slot i-1) and after (slot i); the armed origin offers
    // only after (slot 0) — its "after" IS marker 1's "before", and only one shows at a time.
    const html = isArmed
      ? (i > 0 ? plus(i-1) : "") + `<div class="node is-here armed${sel?" sel":""}">${i+1}</div>` + plus(i)
      : `<div class="node is-here${sel?" sel":""}">${i+1}</div>`;
    const wide = isArmed ? (i > 0 ? 116 : 72) : 28;
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"nodewrap",
      html, iconSize:[wide,44], iconAnchor:[i>0||!isArmed ? wide/2 : 14, 22]})});
    m.addTo(map).bindTooltip(esc(p.name||"stop")
        + (isArmed ? (i ? " — again to edit this leg" : "") : " — tap to add" + (i ? " or edit" : " a stop")),
      {direction:"top",offset:[0,-24]});
    m.on("click", ev => {
      const b = ev.originalEvent && ev.originalEvent.target.closest(".ins");
      L.DomEvent.stop(ev);
      if (b) { armed = null; return startInsert(+b.dataset.slot); }   // F13
      if (armed === i) { armed = null; if (i) return editLeg(i-1); render(); return; }
      armed = i; render();                                            // first tap arms
      if (!i) toast("+ adds the first stop of the trip");
    });
    layers.push(m);
  });
  if(pending){
    const m=L.marker([pending.lat,pending.lng],{icon:L.divIcon({className:"",
      html:'<div class="node pend is-here">?</div>',iconSize:[28,28],iconAnchor:[14,14]})});
    m.addTo(map); layers.push(m);
  }
  /* Same colour rule as the trip itself (D-060): self-powered legs share one, rail has its
     own, flights are a dashed blue arc, everything else is the vehicle amber. This drew a bike
     leg in the driving colour until the modes landed. */
  const LEG_COLOR = {fly:"#3E7CB1", train:"#8A6FB0", water:"#1B9AAA", bike:"#1B9AAA", walk:"#1B9AAA"};
  for(let i=1;i<pts.length;i++){
    const m = legs[i-1].mode, fly = m==="fly";
    const sel = editing === i-1;
    const l=L.polyline([[pts[i-1].lat,pts[i-1].lng],[pts[i].lat,pts[i].lng]],
      {color: LEG_COLOR[m] || "#F2A900", weight: sel?7:4, opacity:.95,
       dashArray: fly?"7 8":null, interactive:true, bubblingMouseEvents:false});
    /* A 4px line is a poor tap target, so an invisible fat line sits under it — the same
       trick a map app uses, and the reason a leg feels tappable rather than fiddly. */
    const hit=L.polyline([[pts[i-1].lat,pts[i-1].lng],[pts[i].lat,pts[i].lng]],
      {color:"#000", weight:22, opacity:0, interactive:true, bubblingMouseEvents:false});
    hit.on("click", ev => { L.DomEvent.stop(ev); armed = null; editLeg(i-1); });   // D-065 / F14
    l.addTo(map); hit.addTo(map); layers.push(l, hit);
  }
  const n=legs.length;
  $("keep").disabled = n===0;
  $("tally").innerHTML = step ? RING_ASKS[step]
    : insertAt !== null ? "Tap where the new stop goes &mdash; it lands between the two either side"
    : !origin ? "Tap the map where the trip starts, or type a place."
    : n===0 ? "Now tap where you&rsquo;re going."
    : `<b>${n} leg${n>1?"s":""}</b> &middot; tap the map for the next`;
}

const short = (s,n) => { const t=(s||"").split(",")[0].trim();
  return t.length > (n||16) ? t.slice(0,(n||16)-1).trimEnd()+"\u2026" : t; };
const coordName = p => "Pin " + p.lat.toFixed(2) + ", " + p.lng.toFixed(2);

async function nameIt(p){
  try{ const r=await fetch("/api/geocode?lat="+p.lat+"&lon="+p.lng); const d=await r.json();
    if(d&&d.name){ p.name=d.name; save(); render(); if(step) reopen(); } }catch(e){}
}
let reopen = ()=>{};

/* ── the three steps ──────────────────────────────────────────────────────────────────── */
function askMode(){
  step="mode"; reopen=askMode; render();
  const from = insertAt !== null
    ? (insertAt === 0 ? origin : legs[insertAt-1].to)          // F13: the stop before the slot
    : editing !== null
      ? (editing === 0 ? origin : legs[editing-1].to)          // F14: unchanged by an edit
      : legs.length ? legs[legs.length-1].to : origin;
  openRing(pending, "from " + short(from.name||coordName(from), 11), short(pending.name,14)||"there",
    Object.keys(TREE).map(k=>({key:k,label:TREE[k].label,gly:TREE[k].gly})),
    it=>{ draft={to:pending, mode:it.key, subtype:null, date:"", who:[], path:null, stay:null, note:""};
          askKind(); },
    ()=>cancel());
}
function askKind(){
  step="kind"; reopen=askKind; render();
  const m=TREE[draft.mode];
  openRing(pending, m.label, "what kind?", m.subs.map(s=>({...s})),
    s=>{ draft.subtype=s.id; if(s.craft) draft.craft=s.craft;
         if(s.next==="flight") return openAsk("Flight number?","Optional. With it, Ask can fill in real times once the trip is yours.","e.g. AA1902",
            v=>{ if(v) draft.flight=v.toUpperCase(); askWhen(s); });
         if(s.next==="pickup") return openAsk("Rental picked up where?","A rental has to go back somewhere — worth noting now.","here, or somewhere else",
            v=>{ if(v) draft.note="Rental: "+v; askWhen(s); });
         askWhen(s); },
    ()=>askMode());
}
function askWhen(s){
  step="when"; reopen=()=>askWhen(s); render();
  const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  openRing(pending, short(TREE[draft.mode].label+" · "+s.label, 18), "when?", [
      {label:"Today", v:iso(new Date())},
      {label:"Tomorrow", v:iso(new Date(Date.now()+86400000))},
      {label:"Pick…", v:"?"},
      {label:"Skip", v:""}],
    it=>{ if(it.v==="?") return openAsk("Which day?","","YYYY-MM-DD", v=>commit(s, /^\d{4}-\d{2}-\d{2}$/.test(v)?v:""));
          commit(s, it.v); },
    ()=>askKind());
}
function commit(s, date){
  draft.date=date;
  if(!draft.to.name) draft.to.name=coordName(draft.to);
  const wasEditing = editing !== null;
  if (wasEditing)            legs[editing] = draft;
  else if (insertAt !== null) legs.splice(insertAt, 0, draft);   // F13
  else                        legs.push(draft);
  const craft=draft.craft;
  draft=null; pending=null; step=null; editing=null; insertAt=null; armed=null;
  closeRing(); save(); render();
  toast(wasEditing ? "Leg updated"
      : craft ? `Added — the ${craft.toLowerCase()} gets its own vehicle in the trip`
              : "Leg added — tap the map for the next");
}

/* D-065 / audit F14: tap a leg or its marker to reopen it. The ring anchors at the leg's
   destination and the three steps run exactly as they do for a new leg, prefilled — so there
   is one path through mode → kind → when, not two that can drift apart. */
function startInsert(slot){
  if (step) return;
  insertAt = slot; editing = null; draft = null; pending = null;
  render();
  toast(slot === 0 ? "Tap where the trip should go first"
                   : "Tap where this stop goes — it lands between the two either side");
}

function editLeg(i){
  if (step) return;                       // a ring is already open; the veil dismisses it
  if (i < 0 || i >= legs.length) return;
  editing = i;
  draft   = { ...legs[i] };
  pending = legs[i].to;
  render();                               // paints the selection before the ring covers it
  askMode();
}

/* ── the map ──────────────────────────────────────────────────────────────────────────── */
map.on("click", e=>{
  if(step) return;                              // the veil handles dismissing
  if(armed !== null){ armed = null; render(); return; }   // disarm; never also place a point
  const p={lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6), name:null};
  // W3 (cold walk 2026-07-29): this used to render the origin and never save it, so closing
  // the tab between the first tap and the second lost the start of the trip. Every other
  // action here persists; this one is the first thing anybody does.
  if(!origin){ origin=p; save(); render(); nameIt(p); toast("Now tap where you're going"); return; }
  pending=p; render(); nameIt(p); askMode();
});

/* ── draft: the shared v3 `ttb_scratch` shape (D-075) ──────────────────────────────────────
   This comment used to claim the three builders wrote byte-identical drafts. They did not, and
   the claim is why nobody checked (DEEP_AUDIT D3). The rule now is narrower and true: each
   builder preserves what it does not edit, so moving a trip between them stops destroying it. */
function save(){
  /* Write back what this builder edits, plus everything it was carrying. Legs spread first so a
     field this UI has no control for survives the round trip. */
  const d={v:3, created:Date.now(), name:$("name").textContent.trim(), people:carried.people,
    routes:[{origin, legs:legs.map(l=>({...l, to:l.to, mode:l.mode, subtype:l.subtype||null,
      craft:l.craft||null, flight:l.flight||null, date:l.date, who:l.who,
      path:l.path, stay:l.stay, note:l.note}))}, ...carried.extraRoutes]};
  try{ localStorage.setItem(SCRATCH_KEY, JSON.stringify(d)); }catch(e){}
}
function restore(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(SCRATCH_KEY)||"null"); }catch(e){}
  if(!d||d.v!==3||!Array.isArray(d.routes)||!d.routes.length) return;
  const r=d.routes[0]; if(!r||!r.origin) return;
  /* Hold the crew and any other tracks so save() puts them back untouched (D-075). */
  carried = { people: Array.isArray(d.people)?d.people:[], extraRoutes: d.routes.slice(1) };
  origin=r.origin; legs=(r.legs||[]).map(l=>({...l, who:l.who||[]}));
  if(d.name) $("name").textContent=d.name;
  render();
  if(legs.length) frameTrip();
}

/* Q1: this used to run synchronously inside restore(), which is before the container has been
   laid out — so Leaflet fitted against a size it did not have yet and the map stayed on the
   hardcoded US default. The `try{}catch(e){}` is why it was silent for so long.

   It was invisible by luck: the stored draft spanned Colorado to Oklahoma and the default view
   is the whole United States, so every stop landed on screen anyway. A trip in Europe or Japan,
   or one inside a single city, would have restored to a US map with the trip off it entirely.

   Two changes. invalidateSize() first, so Leaflet re-reads the container it actually has. And
   the fit is deferred to a frame after layout rather than issued during it. The result is then
   CHECKED — if a point is still outside the viewport the console says so, because a framing bug
   that reports nothing is exactly how this survived. */
function frameTrip(){
  const pts=[origin,...legs.map(l=>l.to)].map(p=>[p.lat,p.lng]);
  const go=()=>{
    try{
      map.invalidateSize();
      map.fitBounds(pts,{padding:[60,60],paddingBottomRight:[60,130],maxZoom:11});
      const b=map.getBounds();
      const out=pts.filter(p=>!b.contains(p));
      if(out.length) console.warn("frameTrip: "+out.length+" of "+pts.length+" stops are outside the view after fitting");
    }catch(e){ console.warn("frameTrip failed:", e && e.message); }
  };
  /* setTimeout, NOT requestAnimationFrame. rAF is suspended while a tab is hidden, so a trip
     opened in a background tab would not be framed until someone looked at it — and it made the
     fix untestable in a headless pane, where document.hidden is always true. A zero timer after
     load is just as much "after layout" and fires either way. */
  if(document.readyState==="complete") setTimeout(go,0);
  else addEventListener("load", ()=>setTimeout(go,0), {once:true});
}

$("undo").onclick=()=>{ if(step) return cancel();
  if(legs.length){ legs.pop(); save(); render(); toast("Last leg removed"); return; }
  if(origin){ origin=null; save(); render(); toast("Start cleared"); return; }
  toast("Nothing to undo"); };
$("name").addEventListener("input", save);
$("name").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } });
addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($("ask").classList.contains("on")) $("ask").classList.remove("on"); else cancel(); } });
addEventListener("resize", ()=>{ if(step) reopen(); });

$("keep").onclick=()=>{
  if(!legs.length){ toast("Add a leg first"); return; }
  save();
  /* Hand off to the leg-card editor rather than straight to checkout. The ring is good at the
     shape of a trip and bad at its detail, and /new is where the tiers, the dates and the
     notes are — so "keep it" means "see the whole thing, then decide", not "pay now". */
  location.href = "/new" + location.search;
};

/* Open the map where they are, rather than on the whole country (review 1b.3).
   "Tap the map where the trip starts" is a rough first move on a phone when the map opens at
   zoom 4 over the continental US — you pan and pinch to your own city before you can begin.

   Two deliberate limits. It only runs when there is nothing yet: a restored draft owns the
   view, and stealing it would move the map out from under someone mid-trip. And it CENTRES the
   map without placing anything — an origin the user did not choose is worse than one more tap,
   because a wrong start propagates through every leg and the route drawn from it. The
   "Start here" chip makes the pre-place explicit and one tap, which is the convenience without
   the silent commitment.

   Failure is silence: no permission, no support, or a timeout all leave the previous behaviour
   exactly as it was. Nothing here blocks the first tap while it waits. */
function locateFirst(){
  if(origin || legs.length) return;
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    if(origin || legs.length) return;            // they may have tapped while we waited
    const lat=+pos.coords.latitude.toFixed(6), lng=+pos.coords.longitude.toFixed(6);
    map.setView([lat,lng], 11);
    const b=$("hereBtn");
    b.hidden=false;
    b.onclick=()=>{
      if(origin) return;
      const c=map.getCenter();                   // wherever they have panned to, not where we found them
      origin={lat:+c.lat.toFixed(6), lng:+c.lng.toFixed(6), name:null};
      save(); render(); nameIt(origin); b.hidden=true;
      toast("Now tap where you're going");
    };
  }, ()=>{}, {enableHighAccuracy:false, timeout:8000, maximumAge:600000});
}

restore(); render(); locateFirst();
</script>
<script src="/pages.js?v=1"></script>
<script src="/maptheme.js?v=1"></script>
</html>
