name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with: { php-version: '8.2' }

      - name: PHP syntax
        run: |
          ERR=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "✗ $f"; php -l "$f"; ERR=$((ERR+1)); }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './reference/*')
          [ $ERR -eq 0 ] || { echo "🚫 $ERR file(s) failed"; exit 1; }
          echo "✓ PHP clean"

      # The client has no build step, so nothing else parses this JS before a browser does.
      - name: Inline JS syntax
        run: ./scripts/check-inline-js.sh

      - name: Chat-agent tool adapter
        run: php test/tools-test.php

      # CLAUDE.md: never commit a Stripe key, a trip password, or a token hash. Patterns require a
      # long suffix so that DOCUMENTING a prefix (docs, this file, the redaction regexes) is not a hit.
      # Cheap belt-and-braces so a slip fails the build instead of reaching the remote.
      - name: Secret scan
        run: |
          if git grep -nE '(sk|rk)_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- . ':!.github/workflows/ci.yml' ':!Makefile'; then
            echo "🚫 possible secret committed"; exit 1
          fi
          echo "✓ no key material"
